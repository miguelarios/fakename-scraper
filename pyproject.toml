[project]
name = "fakename-scraper"
version = "0.1.1"
description = "CLI tool to scrape fake identities from fakenamegenerator.com"
requires-python = ">=3.10"
license = "MIT"
keywords = ["fake", "name", "generator", "scraper", "testing", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "requests",
    "beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/mrios/fakename"

[project.scripts]
fakename = "fakename.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fakename"]
